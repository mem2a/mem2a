# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mem2a"
version = "0.1.0.dev0"
description = "Reference implementation of Mem2A v0.1, an A2A extension that lets agents negotiate with company memory before they act."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["a2a", "agents", "memory", "mem2a"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  # Pinned to 1.2.x on purpose: out-of-band updates (listen) reach the task
  # through DefaultRequestHandlerV2._active_task_registry, a private attribute
  # (see mem2a/server.py, run_internal_turn). Re-check it before widening.
  "a2a-sdk[http-server]>=1.2.1,<1.3",
  "httpx>=0.28",
  "pydantic>=2.7",
  "starlette>=0.40",
  "jsonschema>=4.18",
  "referencing>=0.30",
  # Make `format: date-time` and `format: uri` checks deterministic: without
  # these, jsonschema silently skips them.
  "rfc3339-validator>=0.1.4",
  "rfc3986-validator>=0.1.1",
]

[project.optional-dependencies]
server = ["uvicorn>=0.30"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "uvicorn>=0.30",
]

[project.urls]
Specification = "https://w3id.org/mem2a/v0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/mem2a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
